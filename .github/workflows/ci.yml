name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: armable
          POSTGRES_PASSWORD: armable
          POSTGRES_DB: armable_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U armable" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: drone-studio
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgres://armable:armable@127.0.0.1:5432/armable_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: drone-studio/package-lock.json
      - run: npm ci
      - name: Install the local workbench test shell
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: npx tsc --noEmit -p .
      - name: Unit and integration tests (Postgres included)
        run: npm test -- --maxWorkers=2 --exclude 'e2e/**'
      - run: npm run build
      - name: Browser for end-to-end tests
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: E2E=1 npx vitest run e2e
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7
      - name: Format
        run: terraform -chdir=infra/aws fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws/bootstrap init -input=false
          terraform -chdir=infra/aws/bootstrap validate
