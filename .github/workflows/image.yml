name: Build the app image
# Builds Armable's Docker image on every push to main and publishes it to GitHub's container registry,
# so the Google Cloud server (infra/gcp) only has to pull it. Make the package public once, under
# your profile's Packages, so the server can pull it without signing in.
on:
  push:
    branches: [main]
    paths: ['drone-studio/**', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: drone-studio
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/armable:latest
            ghcr.io/${{ github.repository_owner }}/armable:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Armable
          cache-from: type=gha
          cache-to: type=gha,mode=max
