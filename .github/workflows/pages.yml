name: Publish the Lucidity intro page to GitHub Pages
# The app itself needs its server, so Pages only hosts a static intro page. Set the repository variable LUCIDITY_URL
# to the hosted app's address (for example https://app.armable.ai) and the page links to it.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        env:
          LUCIDITY_URL: ${{ vars.LUCIDITY_URL }}
        run: |
          cp -r site _site
          cp drone-studio/public/favicon.svg _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          import os, re, pathlib
          url = os.environ.get('LUCIDITY_URL', '').strip().rstrip('/')
          if url and not re.fullmatch(r'https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?', url):
              raise SystemExit(f'LUCIDITY_URL must be a plain https address, got: {url!r}')
          for page in pathlib.Path('_site').rglob('*.html'):
              page.write_text(page.read_text().replace('__LUCIDITY_URL__', url))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
