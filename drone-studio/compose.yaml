# Run Armable locally with Postgres:  docker compose up --build   then open http://localhost:8787
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: armable, POSTGRES_PASSWORD: armable, POSTGRES_DB: armable }
    volumes: [armable-db:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD', 'pg_isready', '-U', 'armable'], interval: 5s, retries: 10 }
  app:
    build: .
    ports: ['8787:8787']
    environment:
      DATABASE_URL: postgres://armable:armable@db:5432/armable
      # The address people and assistants use. Behind a domain, set it to https://your-domain.
      PUBLIC_URL: http://localhost:8787
    depends_on: { db: { condition: service_healthy } }
volumes:
  armable-db:
